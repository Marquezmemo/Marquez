name: Build and Push Custom RunPod Image

on:
  push:
    branches:
      - main
      - master  # Por si tu repositorio usa master o main, se activará con cualquiera de las dos

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2  # <- CORREGIDO: Cambiado de actions/ a docker/

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/entorno-gs:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

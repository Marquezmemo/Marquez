[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord-gs-training.log
pidfile=/tmp/supervisord-gs-training.pid

[program:bootstrap]
command=/opt/pipeline/scripts/bootstrap/bootstrap-gs-training.sh
autorestart=false
startsecs=0
priority=10
stdout_logfile=/workspace/logs/bootstrap-gs-training.log
stderr_logfile=/workspace/logs/bootstrap-gs-training.err

[program:jupyter]
command=/opt/pipeline/scripts/runtime/start-jupyter.sh
autorestart=true
priority=20
stdout_logfile=/workspace/logs/jupyter.log
stderr_logfile=/workspace/logs/jupyter.err

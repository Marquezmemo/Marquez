[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord-blender.log
pidfile=/tmp/supervisord-blender.pid

[program:bootstrap]
command=/opt/pipeline/scripts/bootstrap/bootstrap-blender-workstation.sh
autorestart=false
startsecs=0
priority=10
stdout_logfile=/workspace/logs/bootstrap-blender.log
stderr_logfile=/workspace/logs/bootstrap-blender.err

[program:xorg]
command=/opt/pipeline/scripts/runtime/start-xorg.sh
autorestart=true
priority=20
stdout_logfile=/workspace/logs/xorg-supervisor.log
stderr_logfile=/workspace/logs/xorg-supervisor.err

[program:openbox]
command=/opt/pipeline/scripts/runtime/start-openbox.sh
autorestart=true
priority=30
environment=DISPLAY=":0"
stdout_logfile=/workspace/logs/openbox.log
stderr_logfile=/workspace/logs/openbox.err

[program:sunshine]
command=/opt/pipeline/scripts/runtime/start-sunshine.sh
autorestart=true
priority=40
environment=DISPLAY=":0"
stdout_logfile=/workspace/logs/sunshine.log
stderr_logfile=/workspace/logs/sunshine.err

[program:blender]
command=/opt/pipeline/scripts/runtime/start-blender.sh
autorestart=false
priority=50
environment=DISPLAY=":0"
stdout_logfile=/workspace/logs/blender-supervisor.log
stderr_logfile=/workspace/logs/blender-supervisor.err
